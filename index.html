async function sendMessage(text) {
    if (!text.trim()) return;

    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    try {
       
        messageInput.disabled = true;
        sendButton.disabled = true;

        await db.collection('messages').add({
            text: text.trim(),
            userId: auth.currentUser.uid,
            userEmail: auth.currentUser.email,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

         
        messageInput.value = '';
        messageContainer.scrollTop = messageContainer.scrollHeight;

    } catch (error) {
         
        alert('Error sending message: ' + error.message);
        console.error('Error sending message:', error);

    } finally {
         
        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();
    }
}

        function listenToMessages() {
    try {
        db.collection('messages')
            .orderBy('timestamp')
            .onSnapshot((snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        const message = change.doc.data();
                        const messageElement = document.createElement('div');
                        messageElement.className = `message ${
                            message.userId === auth.currentUser.uid ? 'sent' : 'received'
                        }`;
                        messageElement.innerHTML = `
                            <span class="message-email">${message.userEmail}</span>
                            <div class="message-text">${message.text}</div>
                        `;
                        messageContainer.appendChild(messageElement);
                    }
                });
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }, (error) => {
                console.error("Error listening to messages:", error);
                alert("Error loading messages. Please refresh the page.");
            });
    } catch (error) {
        console.error("Error setting up message listener:", error);
        alert("Error connecting to chat. Please refresh the page.");
    }
}

       
        sendButton.addEventListener('click', () => {
            sendMessage(messageInput.value);
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage(messageInput.value);
            }
        });

        signOutButton.addEventListener('click', () => {
            auth.signOut();
        });

         
        auth.onAuthStateChanged((user) => {
            if (user) {
                userEmail.textContent = user.email;
                listenToMessages();
            } else {
                window.location.href = 'login.html';
            }
        });
